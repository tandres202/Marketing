<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing Arcade</title>
<style>
:root{--bg:#0b1020;--p:#121a2d;--p2:#19243c;--line:#2a3858;--txt:#f4f7fb;--mut:#a8b4ca;--a:#7c5cff;--g:#00d4a8;--r:#ff5d73}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1b2750,#0b1020 42%);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:260px;background:#090e1cdd;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:900}.brand b{color:var(--g)}.mut{color:var(--mut);font-size:12px}.nav{display:grid;gap:7px;margin-top:20px}.nav button{background:0;border:1px solid transparent;color:#ccd5e7;text-align:left;padding:10px;border-radius:10px}.nav button:hover,.nav button.on{background:var(--p2);border-color:var(--line);color:#fff}.prog{margin-top:20px;padding:12px;background:var(--p);border:1px solid var(--line);border-radius:12px}.bar{height:8px;background:#26314b;border-radius:9px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--g))}.main{max-width:1200px;width:100%;margin:auto;padding:28px}.sec{display:none}.sec.on{display:block}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}h1{font-size:36px;line-height:1.05;margin:5px 0 8px}h2{margin:0 0 10px}h3{margin:0 0 7px}p{line-height:1.55;color:#c8d2e5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.card{background:#121a2df2;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 30px #0002}.click:hover{transform:translateY(-2px);border-color:#566991}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#26314b;color:#c9d3e5;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--a);color:#fff;font-weight:800}.btn.s{background:#27324c}.btn.g{background:#079b7d}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.q{font-size:22px;font-weight:850;line-height:1.35;margin:18px 0}.answers,.choices{display:grid;gap:9px}.answer,.choice{background:#151f35;border:1px solid var(--line);color:#fff;padding:13px;border-radius:11px;text-align:left}.answer:hover,.choice:hover{border-color:#6579a7}.ok{border-color:var(--g)!important;background:#00d4a812!important}.bad{border-color:var(--r)!important;background:#ff5d7312!important}.feed{margin-top:12px;background:#151f35;border:1px solid var(--line);padding:12px;border-radius:10px}.hidden{display:none}.flash{min-height:260px;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,#1d2948,#10182b);border:1px solid var(--line);border-radius:18px}.term{font-size:36px;font-weight:900}.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mi{padding:13px;background:#151f35;border:1px solid var(--line);border-radius:10px;cursor:pointer}.sel{border-color:var(--a)}.matched{border-color:var(--g);opacity:.55}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}input,textarea{width:100%;background:#0e1629;color:#fff;border:1px solid var(--line);padding:11px;border-radius:9px}label{color:var(--mut);font-size:12px}.sort{display:grid;gap:8px}.si{padding:11px;background:#151f35;border:1px solid var(--line);border-radius:9px;display:flex;justify-content:space-between}.si button{border:0;background:#293550;color:#fff;border-radius:6px}.case{white-space:pre-wrap;background:#0e1629;border:1px solid var(--line);padding:15px;border-radius:12px;line-height:1.6;color:#dce5f5}@media(max-width:800px){.side{display:none}.main{padding:16px}h1{font-size:29px}.match{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Marketing <b>Arcade</b></div><div class="mut">Repaso interactivo del parcial</div><div class="nav" id="nav"></div><div class="prog"><div class="mut">Precisión global</div><strong id="pct">0%</strong><div class="bar"><i id="bar"></i></div><div class="mut" id="stats">0 respuestas</div></div></aside><main class="main" id="main"></main></div>
<script>
const M=[
['🎯','Multiple Choice','mcq'],['🔗','Unir conceptos','match'],['✍️','Completar','fill'],['🃏','Cartas','flash'],['⚡','Verdadero/Falso','tf'],['🧩','Ordenar','order'],['🧮','Calculadoras','calc'],['🌍','PESTEL Challenge','pestel'],['🎯','VPC Builder','vpc'],['🎛️','4P Mix Lab','mix'],['📢','Positioning Lab','position'],['🧠','Case Challenge','case'],['🔥','Contrarreloj','rapid']];
const D={
mcq:[
['¿Qué es la miopía de marketing?',['Definir el negocio por la necesidad','Definirlo por el producto y no por la necesidad real','Segmentar por edad','Subir promoción'],1,'El error es confundir el producto con la necesidad real.'],
['¿Qué significa SAM?',['Todo el mercado','Parte a la que realmente podés llegar/atender','Lo que capturás','Penetración'],1,'TAM=todo; SAM=alcanzable; SOM=capturado.'],
['¿Qué fórmula de penetración usamos?',['Clientes/TAM','Clientes/SAM ×100','SOM/TAM','SAM/SOM'],1,'Penetración = clientes actuales ÷ SAM ×100.'],
['¿Qué pertenece al Customer Profile del VPC?',['Jobs, Pains, Gains','Products, Pain Relievers, Gain Creators','4P','PESTEL'],0,'Customer Profile = Jobs/Pains/Gains.'],
['¿Dónde priorizarías la acción en Brand Funnel?',['Mayor cantidad','Siempre Awareness','Menor conversión/mayor leakage','Siempre Loyalty'],2,'Se ataca el eslabón más débil.'],
['NPS =',['Promotores + Detractores','Promotores − Detractores','Detractores − Promotores','Promotores × Detractores'],1,'NPS = % Promotores − % Detractores.'],
['Branded House es:',['Marcas independientes','Una marca madre para múltiples productos','Sin marca','Una marca por canal'],1,'Una marca → múltiples productos/servicios.'],
['Cannibalización es:',['Competidor baja precio','Un producto propio quita ventas a otro propio','Sube TAM','Sube awareness'],1,'La nueva oferta captura ventas de otra oferta propia.'],
['Triple ajuste del mix:',['Producto, precio, plaza','Cliente, compañía, competencia','TAM, SAM, SOM','Marca, canal, promoción'],1,'Antes de mover una palanca: cliente, compañía y competencia.'],
['Segmentación vs targeting:',['Son iguales','Segmentación divide; targeting elige','Segmentación elige; targeting divide','Targeting es solo edad'],1,'Segmentar=dividir; targeting=elegir.'],
['En B2B2C:',['Usuario y comprador siempre son iguales','Usuario final y comprador directo pueden ser distintos','No hay intermediario','Solo existe B2B'],1,'Ontela vende a operadoras y el suscriptor usa el servicio.'],
['¿Qué es un Pain Reliever?',['Una necesidad','Algo que reduce un dolor del cliente','Un producto siempre','Una métrica'],1,'En VPC, reduce un Pain identificado.'] ],
fill:[
['TAM = todo; SAM = parte a la que puedo ________; SOM = lo que puedo ________.','llegar / capturar',['llegar','atender']],
['Las 4P son Product, Price, Place y ________.','Promotion',['promotion']],
['PESTEL termina en ________.','Legal',['legal']],
['Jobs / Pains / Gains pertenecen al ________ Profile.','Customer',['customer']],
['Leakage = 1 − tasa de ________.','conversión',['conversion','conversión']],
['NPS = % Promotores − % ________.','Detractores',['detractores']],
['Segmentar es ________; targeting es ________.','dividir / elegir',['dividir']],
['Un producto propio que le quita ventas a otro propio genera ________.','cannibalización',['cannibalizacion','cannibalización']]],
tf:[
['El SOM depende solo del tamaño del mercado.',false,'También depende de capacidad y ejecución.'],['En B2B2C usuario y comprador pueden ser distintos.',true,'Es el punto central del caso Ontela.'],['El mayor leakage siempre está en la etapa con menos personas.',false,'Se compara la conversión entre transiciones.'],['Las 4P deben funcionar como sistema.',true,'Coherencia, integración y apalancamiento.'],['House of Brands usa una única marca madre.',false,'Eso es Branded House.'],['Todo factor PESTEL es una amenaza.',false,'Puede ser oportunidad o amenaza según el impacto.'],['RFM significa Recency, Frequency, Monetary.',true,'Es el marco trabajado en segmentación/valoración.'],['La miopía consiste en centrarse demasiado en la necesidad real.',false,'Consiste en definir el negocio por producto y no por necesidad.']],
pestel:[['Nueva regulación obligatoria de etiquetado.','Legal'],['Inflación reduce disposición a pagar premium.','Economic'],['Crece preocupación juvenil por comer saludable.','Social'],['Tecnología reduce tiempos de entrega.','Technological'],['Mayores exigencias sobre residuos de envases.','Environmental'],['Nueva política pública afecta al sector.','Political']],
vpc:[['“Necesito resolver mi almuerzo sin cocinar.”','Job'],['“Me molesta que sea demasiado caro.”','Pain'],['“Quiero comer mejor sin perder practicidad.”','Gain'],['“Comidas listas para consumir.”','Product'],['“Delivery rápido que evita cocinar.”','Pain Reliever'],['“Oferta saludable, práctica y rica.”','Gain Creator']],
mix:[['Cambiar receta y formato del producto.','Product'],['Lanzar 20% de descuento.','Price'],['Agregar delivery/app.','Place'],['Campaña con influencers.','Promotion'],['Las 4P cuentan la misma historia.','Coherencia'],['Una P alimenta a otra.','Integración'],['Una P potencia a las demás.','Apalancamiento'],['Antes de subir precio se analiza cliente, empresa y competencia.','Triple ajuste']],
order:[['Brand Funnel',['Awareness','Familiarity','Consideration','Trial','Repurchase','Loyalty']],['TAM/SAM/SOM',['TAM','SAM','SOM']],['STP',['Segmentación','Targeting','Posicionamiento']],['VPC Customer Profile',['Jobs','Pains','Gains']]]};
let S=JSON.parse(localStorage.getItem('ma')||'{}');S.ok??=0;S.n??=0;S.streak??=0;
function save(){localStorage.setItem('ma',JSON.stringify(S));let p=S.n?Math.round(S.ok/S.n*100):0;document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%';document.getElementById('stats').textContent=S.n+' respuestas · racha '+S.streak}
function mark(ok){S.n++;ok?(S.ok++,S.streak++):S.streak=0;save()}
function nav(){document.getElementById('nav').innerHTML=M.map(x=>`<button onclick="go('${x[2]}',this)">${x[0]} ${x[1]}</button>`).join('')}
function go(id,b){document.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b?.classList.add('on');if(window.init?.[id])window.init[id]()}
function home(){document.getElementById('main').innerHTML=`<section id="home" class="sec on"><div class="top"><div><span class="badge">MARKETING · PARCIAL</span><h1>Marketing Arcade 🎮</h1><p>Una página para repasar jugando: conceptos, definiciones, cálculos, casos y velocidad.</p></div><div class="card"><div class="mut">Precisión</div><h2 id="hp">${S.n?Math.round(S.ok/S.n*100):0}%</h2></div></div><div class="grid">${M.slice(0,12).map(x=>`<div class="card click" onclick="go('${x[2]}',document.querySelectorAll('.nav button')[${M.indexOf(x)}])"><span class="badge">${x[0]}</span><h3>${x[1]}</h3><p>Entrená este tema con feedback inmediato.</p></div>`).join('')}</div><div class="card" style="margin-top:14px"><h2>Mapa del parcial</h2><div class="grid"><p><b>Fundamentos:</b> miopía, 5C, customer-centricity, 4P.</p><p><b>Investigación:</b> cualitativa, cuantitativa, personas, clusters, B2B2C.</p><p><b>Dimensionamiento:</b> TAM/SAM/SOM, penetración, top-down/bottom-up.</p><p><b>STP:</b> segmentación, targeting, CLV, RFM, no-consumption.</p><p><b>Valor:</b> VPC, Jobs/Pains/Gains, posicionamiento.</p><p><b>Estratégico:</b> PESTEL, competencia, ventajas, switching costs, network effects.</p><p><b>Marca:</b> Brand Funnel, leakage, NPS, arquitectura.</p><p><b>Mix:</b> 4P, coherencia, integración, apalancamiento, portfolio.</p></div></div></section>`}
function shell(id,title,sub){document.getElementById('main').innerHTML=`<section id="${id}" class="sec on"><div class="top"><div><span class="badge">MARKETING ARCADE</span><h1>${title}</h1><p>${sub}</p></div></div><div id="body" class="card"></div></section>`}
let init={};window.init=init;
init.mcq=()=>{shell('mcq','Multiple Choice 🎯','Preguntas mezcladas de todo el programa.');let i=0;let body=document.getElementById('body');function r(){let x=D.mcq[i%D.mcq.length];body.innerHTML=`<div class="mut">Pregunta ${i+1}/${D.mcq.length}</div><div class="q">${x[0]}</div><div class="answers">${x[1].map((a,j)=>`<button class="answer" data-j="${j}">${String.fromCharCode(65+j)}. ${a}</button>`).join('')}</div><div id="f"></div><div class="row" style="margin-top:12px"><button class="btn s" id="next" disabled>Siguiente</button></div>`;body.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(body.dataset.done)return;body.dataset.done=1;let j=+b.dataset.j,ok=j===x[2];body.querySelectorAll('.answer').forEach((z,k)=>{if(k===x[2])z.classList.add('ok');if(k===j&&!ok)z.classList.add('bad')});mark(ok);document.getElementById('f').innerHTML=`<div class="feed">${ok?'✅ Correcto':'❌ Incorrecto'} — ${x[3]}</div>`;document.getElementById('next').disabled=false});body.querySelector('#next').onclick=()=>{i++;body.dataset.done='';r()}}r()};
init.fill=()=>{shell('fill','Completá ✍️','Escribí el concepto que falta.');let i=0,b=document.getElementById('body');function r(){let x=D.fill[i%D.fill.length];b.innerHTML=`<div class="mut">${i+1}/${D.fill.length}</div><div class="q">${x[0]}</div><input id="ans" placeholder="Tu respuesta..."><div class="row" style="margin-top:12px"><button class="btn" id="ck">Corregir</button><button class="btn s" id="nx">Siguiente</button></div><div id="f"></div>`;b.querySelector('#ck').onclick=()=>{if(b.dataset.done)return;b.dataset.done=1;let v=b.querySelector('#ans').value.toLowerCase().trim(),ok=x[2].some(a=>v===a||v.includes(a));mark(ok);b.querySelector('#f').innerHTML=`<div class="feed">${ok?'✅ Correcto':'❌ Revisá'} — ${x[1]}</div>`};b.querySelector('#nx').onclick=()=>{i++;b.dataset.done='';r()}}r()};
init.tf=()=>{shell('tf','Verdadero / Falso ⚡','Respondé y mirá la explicación.');let i=0,b=document.getElementById('body');function r(){let x=D.tf[i%D.tf.length];b.innerHTML=`<div class="mut">${i+1}/${D.tf.length}</div><div class="q">${x[0]}</div><div class="choices"><button class="choice" id="t">VERDADERO</button><button class="choice" id="f">FALSO</button></div><div id="out"></div><button class="btn s" id="nx" style="margin-top:12px">Siguiente</button>`;['t','f'].forEach(id=>b.querySelector('#'+id).onclick=()=>{if(b.dataset.done)return;b.dataset.done=1;let v=id==='t',ok=v===x[1];mark(ok);b.querySelector('#out').innerHTML=`<div class="feed">${ok?'✅ Correcto':'❌ Incorrecto'} — ${x[2]}</div>`});b.querySelector('#nx').onclick=()=>{i++;b.dataset.done='';r()}}r()};
init.flash=()=>{shell('flash','Cartas de memoria 🃏','Intentá definir antes de revelar.');let i=0,b=document.getElementById('body');function r(){let x=D.mcq[i%D.mcq.length];b.innerHTML=`<div class="flash"><div><div class="mut">CONCEPTO</div><div class="term">${x[0]}</div><p id="def" class="hidden">${x[3]}</p></div></div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="rv">Revelar</button><button class="btn s" id="nx">Otra carta</button></div>`;b.querySelector('#rv').onclick=()=>b.querySelector('#def').classList.remove('hidden');b.querySelector('#nx').onclick=()=>{i++;r()}}r()};
init.match=()=>{shell('match','Unir conceptos 🔗','Elegí un concepto y después su definición.');let b=document.getElementById('body'),pairs=D.mcq.slice(0,6).map((x,i)=>({id:i,a:x[0].replace(/[¿?]/g,''),d:x[3]}));pairs.sort(()=>Math.random()-.5);let left=[...pairs].sort(()=>Math.random()-.5),right=[...pairs].sort(()=>Math.random()-.5),lt=null,rd=null,done={};function r(){b.innerHTML=`<div class="match"><div>${left.map(x=>`<div class="mi ${done[x.id]?'matched':''} ${lt===x.id?'sel':''}" data-l="${x.id}">${x.a}</div>`).join('')}</div><div>${right.map(x=>`<div class="mi ${done[x.id]?'matched':''} ${rd===x.id?'sel':''}" data-r="${x.id}">${x.d}</div>`).join('')}</div></div><div id="f"></div><button class="btn s" id="new" style="margin-top:12px">Nueva ronda</button>`;b.querySelectorAll('[data-l]').forEach(z=>z.onclick=()=>{lt=+z.dataset.l;r()});b.querySelectorAll('[data-r]').forEach(z=>z.onclick=()=>{rd=+z.dataset.r;if(lt!==null){let ok=lt===rd;mark(ok);b.querySelector('#f').innerHTML=`<div class="feed">${ok?'✅ Pareja correcta':'❌ No coinciden'}</div>`;if(ok)done[lt]=1;lt=rd=null;r()}});b.querySelector('#new').onclick=()=>{location.reload()}}r()};
init.order=()=>{shell('order','Ordená el proceso 🧩','Usá las flechas para ponerlo en orden.');let i=0,b=document.getElementById('body');function r(){let x=D.order[i%D.order.length],a=[...x[1]].sort(()=>Math.random()-.5);b.innerHTML=`<h2>${x[0]}</h2><div class="sort">${a.map((v,j)=>`<div class="si"><span>${j+1}. ${v}</span><span><button data-i="${j}" data-d="-1">↑</button> <button data-i="${j}" data-d="1">↓</button></span></div>`).join('')}</div><div id="f"></div><div class="row" style="margin-top:12px"><button class="btn" id="check">Comprobar</button><button class="btn s" id="next">Nuevo</button></div>`;let items=[...b.querySelectorAll('.si')];b.querySelectorAll('button[data-i]').forEach(z=>z.onclick=()=>{let j=+z.dataset.i,k=j+ +z.dataset.d;if(k<0||k>=a.length)return;[a[j],a[k]]=[a[k],a[j]];r()});b.querySelector('#check').onclick=()=>{let ok=a.join('|')===x[1].join('|');mark(ok);b.querySelector('#f').innerHTML=`<div class="feed">${ok?'✅ Perfecto':'❌ Todavía no'} </div>`};b.querySelector('#next').onclick=()=>{i++;r()}}r()};
init.calc=()=>{shell('calc','Calculadoras 🧮','TAM/SAM/SOM, penetración, Brand Funnel y NPS.');document.getElementById('body').innerHTML=`<div class="grid"><div class="card"><h2>TAM / SAM / SOM</h2><div class="form"><input id="tam" type="number" value="800000" placeholder="TAM"><input id="sp" type="number" value="25" placeholder="% SAM/TAM"><input id="op" type="number" value="5" placeholder="% SOM/SAM"><input id="cur" type="number" value="5000" placeholder="Clientes actuales"></div><button class="btn" id="cm" style="margin-top:10px">Calcular</button><div id="mr" class="feed"></div></div><div class="card"><h2>Brand Funnel</h2><div class="form">${[1,2,3,4,5,6].map((n,i)=>`<input id="f${n}" type="number" value="${[40000,32000,20000,10000,7000,5600][i]}" placeholder="Etapa ${n}">`).join('')}</div><button class="btn" id="cf" style="margin-top:10px">Calcular</button><div id="fr" class="feed"></div></div><div class="card"><h2>NPS</h2><div class="form"><input id="pr" type="number" value="65" placeholder="Promotores %"><input id="de" type="number" value="15" placeholder="Detractores %"></div><button class="btn" id="cn" style="margin-top:10px">Calcular</button><div id="nr" class="feed"></div></div></div>`;document.getElementById('cm').onclick=()=>{let t=+tam.value,s=t*+sp.value/100,o=s*+op.value/100,p=+cur.value/s*100;mr.innerHTML=`TAM <b>${t.toLocaleString()}</b><br>SAM <b>${s.toLocaleString()}</b><br>SOM <b>${o.toLocaleString()}</b><br>Penetración <b>${p.toFixed(2)}%</b>`};document.getElementById('cf').onclick=()=>{let a=[1,2,3,4,5,6].map(n=>+document.getElementById('f'+n).value),names=['Awareness→Familiarity','Familiarity→Consideration','Consideration→Trial','Trial→Repurchase','Repurchase→Loyalty'];let c=names.map((n,i)=>a[i+1]/a[i]*100);fr.innerHTML=c.map((v,i)=>`${names[i]}: <b>${v.toFixed(1)}%</b> conv · ${(100-v).toFixed(1)}% leakage`).join('<br>')+`<hr>Principal fuga: <b>${names[c.indexOf(Math.min(...c))]}</b>`};document.getElementById('cn').onclick=()=>nr.innerHTML=`NPS = <b>${+pr.value-+de.value}</b>`};
init.pestel=()=>simple('pestel','PESTEL Challenge 🌍','Clasificá el factor.',D.pestel,['Political','Economic','Social','Technological','Environmental','Legal']);
init.vpc=()=>simple('vpc','VPC Builder 🎯','Clasificá la frase.',D.vpc,['Job','Pain','Gain','Product','Pain Reliever','Gain Creator']);
init.mix=()=>simple('mix','4P Mix Lab 🎛️','Identificá la P o el concepto del mix.',D.mix,['Product','Price','Place','Promotion','Coherencia','Integración','Apalancamiento','Triple ajuste']);
function simple(id,title,sub,arr,opts){shell(id,title,sub);let i=0,b=document.getElementById('body');function r(){let x=arr[i%arr.length];b.innerHTML=`<div class="q">${x[0]}</div><div class="choices">${opts.map(o=>`<button class="choice">${o}</button>`).join('')}</div><div id="f"></div><button class="btn s" id="n" style="margin-top:12px">Siguiente</button>`;b.querySelectorAll('.choice').forEach(z=>z.onclick=()=>{if(b.dataset.done)return;b.dataset.done=1;let ok=z.textContent===x[1];mark(ok);b.querySelector('#f').innerHTML=`<div class="feed">${ok?'✅ Correcto':'❌ Incorrecto'} — Respuesta: <b>${x[1]}</b></div>`});b.querySelector('#n').onclick=()=>{i++;b.dataset.done='';r()}}r()}
init.position=()=>{shell('position','Positioning Lab 📢','Construí un statement con los 4 componentes.');let b=document.getElementById('body');b.innerHTML=`<div class="form"><label>Customer target<input id="pt" placeholder="¿Para quién?"></label><label>Need<input id="pn" placeholder="¿Qué necesita?"></label><label>Benefit<input id="pb" placeholder="¿Qué beneficio recibe?"></label><label>Differentiation<input id="pd" placeholder="¿Por qué vos?"></label></div><button class="btn" id="build" style="margin-top:12px">Construir</button><div id="prr" class="feed"></div>`;b.querySelector('#build').onclick=()=>prr.innerHTML=`Para <b>${pt.value}</b>, que necesita <b>${pn.value}</b>, ofrecemos <b>${pb.value}</b>, diferenciándonos por <b>${pd.value}</b>.`};
init.case=()=>{shell('case','Case Challenge 🧠','Identificá → explicá → aplicá, como en el parcial.');document.getElementById('body').innerHTML=`<div class="case">NOVA BOX vende comidas listas para consumir mediante una app. Empezó enfocándose en personas que entrenan, pero también crece entre estudiantes y jóvenes profesionales. Entrega en CABA y algunas zonas del GBA. Tiene una línea premium y evalúa lanzar una económica para estudiantes. Sus competidores directos ofrecen productos similares a menor precio. Es muy conocida entre deportistas, pero poco conocida entre estudiantes. La dirección propone: “Subamos el precio de Premium y usemos la línea económica para capturar estudiantes”.</div><p><b>Consigna:</b> analizá la decisión usando al menos 6 conceptos del curso.</p><textarea id="ca" rows="9" placeholder="Escribí tu análisis..."></textarea><button class="btn" id="ev" style="margin-top:10px">Evaluar checklist</button><div id="cfb" class="feed"></div>`;document.getElementById('ev').onclick=()=>{let t=ca.value.toLowerCase(),ks=['cliente','competencia','segment','target','precio','mix','propuesta','pestel','brand','tam','sam','som','posicion'];let hit=ks.filter(k=>t.includes(k)).length;cfb.innerHTML=`Detecté <b>${hit}/${ks.length}</b> áreas relevantes. ${hit>=7?'🔥 Muy completo':'🟡 Buscá conectar más conceptos con la decisión.'}<br><span class="mut">Importante: no alcanza con nombrar conceptos; explicá qué información usarías y cómo cambia la decisión.</span>`}};
init.rapid=()=>{shell('rapid','Contrarreloj 🔥','10 preguntas en 60 segundos.');let b=document.getElementById('body');let i=0,score=0,time=60,timer;function start(){clearInterval(timer);i=0;score=0;time=60;r();timer=setInterval(()=>{time--;document.getElementById('clock').textContent=time;if(time<=0){clearInterval(timer);b.innerHTML=`<h2>Tiempo ⏱️</h2><div class="q">Resultado: ${score}/10</div><button class="btn" id="again">Otra vez</button>`;document.getElementById('again').onclick=start}},1000)}function r(){let x=D.mcq[i%10];b.innerHTML=`<div class="mut" id="clock">${time}</div><div class="q">${x[0]}</div><div class="answers">${x[1].map((a,j)=>`<button class="answer" data-j="${j}">${a}</button>`).join('')}</div>`;b.querySelectorAll('.answer').forEach(z=>z.onclick=()=>{let ok=+z.dataset.j===x[2];mark(ok);if(ok)score++;i++;i>=10?(clearInterval(timer),b.innerHTML=`<h2>Terminaste 🔥</h2><div class="q">${score}/10</div><button class="btn" id="again">Otra vez</button>`,document.getElementById('again').onclick=start):r()})}b.innerHTML='<h2>¿Listo?</h2><p>Tenés 60 segundos.</p><button class="btn" id="start">Empezar</button>';document.getElementById('start').onclick=start};
function boot(){nav();home();save()}boot();
</script></body></html>
